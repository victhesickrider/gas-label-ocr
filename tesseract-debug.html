<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tesseract debug</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<input type="file" id="f" accept="image/*">
<pre id="out">select a photo…</pre>
<script>
const out=document.getElementById('out');
document.getElementById('f').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  out.textContent='loading image…';
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=async()=>{
    const MAX=1200;const s=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    out.textContent='image '+c.width+'x'+c.height+'\ncreating worker…';
    const w=await Tesseract.createWorker('eng');
    out.textContent+='\nrecognizing…';
    const {data}=await w.recognize(c);
    out.textContent+='\n\n=== WORDS: '+ (data.words||[]).length +' ===\n';
    out.textContent+='TEXT:\n'+(data.text||'').slice(0,800);
    const sample=(data.words||[]).slice(0,20).map(x=>x.text);
    out.textContent+='\n\nSAMPLE WORDS:\n'+sample.join(' | ');
  };
  img.src=url;
});
</script>
</body>
</html>

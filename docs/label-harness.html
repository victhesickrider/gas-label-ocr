<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>L harness</title>
<style>body{font:14px system-ui;background:#111;color:#eee}</style>
</head>
<body>
<script>
// Label detection via luminance (white region on brown box)
function computeWhiteRegions(imgEl) {
  const canvas = document.createElement('canvas');
  const w = imgEl.naturalWidth, h = imgEl.naturalHeight;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgEl, 0, 0);
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  // threshold: near-white pixels
  const THRESH = 230;
  const whiteMap = new Uint8Array(w * h);
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    whiteMap[i / 4] = (g > THRESH) ? 1 : 0;
  }
  // find bounding box of all white pixels
  let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (whiteMap[y * w + x]) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
}
window.computeWhiteRegions = computeWhiteRegions;
document.title = 'label harness ready';
</script>
</body>
</html>

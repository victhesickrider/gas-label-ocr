<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tesseract debug</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>body{font:14px system-ui;max-width:900px;margin:20px auto}pre{background:#f4f4f4;padding:10px;border-radius:6px}</style>
</head>
<body>
<h1>Tesseract.js debug on real label photo</h1>
<input type="file" id="f" accept="image/*">
<pre id="out">Select a label photo…</pre>
<script>
const out=document.getElementById('out');
const log=(...a)=>{out.textContent+=a.join(' ')+'\n';};
document.getElementById('f').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  out.textContent='';
  log('file:',f.name,f.type,f.size,'bytes');
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=async()=>{
    log('orig:',img.width,'x',img.height);
    const MAX=1400;
    const scale=Math.min(1,MAX/Math.max(img.width,img.height));
    const big=document.createElement('canvas');
    big.width=Math.max(1,Math.round(img.width*scale));big.height=Math.max(1,Math.round(img.height*scale));
    const bx=big.getContext('2d');bx.drawImage(img,0,0,big.width,big.height);
    log('scaled:',big.width,'x',big.height,'for Tesseract');
    // grayscale + contrast normalize
    const gray=document.createElement('canvas');gray.width=big.width;gray.height=big.height;
    const gx=gray.getContext('2d');
    const id=gx.getImageData(0,0,gray.width,gray.height);
    const d=id.data;
    for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;}
    gx.putImageData(id,0,0);
    const crop=document.createElement('canvas');
    // crop center 70% (rough label region)
    const cx0=Math.round(big.width*.15), cy0=Math.round(big.height*.1);
    const cx1=Math.round(big.width*.85), cy1=Math.round(big.height*.85);
    crop.width=cx1-cx0;crop.height=cy1-cy0;
    crop.getContext('2d').drawImage(gray,cx0,cy0,crop.width,crop.height,0,0,crop.width,crop.height);
    log('crop:',crop.width,'x',crop.height);
    log('creating Tesseract worker…');
    const w=await Tesseract.createWorker('eng');
    log('recognizing…');
    const {data}=await w.recognize(crop);
    log('words:',(data.words||[]).length);
    log('text[0..400]:\n',(data.text||'').replace(/\s+/g,' ').slice(0,400));
    log('sample:',(data.words||[]).slice(0,30).map(x=>x.text).join(' | '));
    await w.terminate();
  };
  img.src=url;
});
</script>
</body>
</html>
